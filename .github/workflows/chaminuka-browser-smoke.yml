name: Chaminuka multi-browser smoke

on:
  pull_request:
    branches: [chaminuka-release]
    paths:
      - 'verify.js'
      - '.github/workflows/chaminuka-browser-smoke.yml'
      - 'public/**'
      - 'server.js'
      - 'campaign.js'
      - 'act2.js'
      - 'shrine.js'
      - 'grid.js'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout game source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install optional browser testing dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify three independent browsers and touchscreen
        run: node verify.js
      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaminuka-browser-screenshots
          path: verify-shots/
          if-no-files-found: ignore
          retention-days: 3
