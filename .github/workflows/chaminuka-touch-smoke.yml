name: Chaminuka touch-control browser smoke

on:
  pull_request:
    branches: [chaminuka-release]
    paths:
      - 'public/touch-controls.js'
      - 'test/touch-browser-smoke.js'
      - '.github/workflows/chaminuka-touch-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci
      - name: Install Playwright for CI
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise real mobile touch events
        run: node test/touch-browser-smoke.js
